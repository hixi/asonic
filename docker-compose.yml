name: 'asonic test-in-docker'

services:
  pytest:
    command: >-
      bash -c '
        uv run pytest /app
      '
    environment:
      - SONIC_HOST=sonic
    build:
      context: .
    links:
      - sonic
    # depends_on:
    #   sonic:
    #     condition: service_healthy
  sonic:
    image: valeriansaliou/sonic:v1.4.9
    volumes:
      - ./tests/config.cfg:/etc/sonic.cfg
